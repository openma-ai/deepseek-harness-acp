name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native Linux ARM64 is a supported target, not an emulated smoke test.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # node:zlib zstd APIs (used by the harness session store) need >= 22.15
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Upload tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: "*.tgz"

  package-install:
    name: package install (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: standalone
            pattern: serves standalone from one complete dsh peer host
          - id: rc7-profile
            pattern: serves as a profile plugin on a coherent rc[.]7 host
          - id: current-prerelease
            pattern: accepts the current 0[.]1[.]1 prerelease host under strict peer resolution
          - id: remaining
            pattern: keeps an rc[.]6 profile coherent|is idempotent when the same ACP bundle is added to a profile twice|rejects an explicitly incompatible standalone host under strict peer resolution|serves ACP after installation into a dsh profile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test package and profile installation
        run: npm run test:install -- -t "${{ matrix.pattern }}"

  dsh-compatibility:
    name: dsh compatibility (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rc.1 introduced the permission/commands API break; latest guards
        # against the next independently published harness release.
        dsh: [0.1.1-rc.1, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install dsh compatibility host
        run: npm install --prefix "${{ runner.temp }}/dsh-host" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Exercise session controls through the host
        run: npm run test:host
        env:
          DSH_ACP_TEST_HOST: ${{ runner.temp }}/dsh-host
