name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native Linux ARM64 is a supported target, not an emulated smoke test.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # node:zlib zstd APIs (used by the harness session store) need >= 22.15
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - name: Upload tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: "*.tgz"

  standalone:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
          path: artifact
      - name: Boot isolated bundled runtime
        shell: bash
        run: node scripts/standalone-smoke.mjs artifact/*.tgz

  compatibility-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: echo "versions=$(cat runtime/compatibility.json)" >> "$GITHUB_OUTPUT"

  dsh-compatibility:
    needs: compatibility-versions
    name: dsh --profile (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.compatibility-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install independent dsh host
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host"
          npm exec -- pnpm --dir "$RUNNER_TEMP/dsh-host" add --ignore-scripts --config.auto-install-peers=true "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Pack ACP plugin
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Exercise the installed dsh profile
        run: npm exec -- node scripts/profile-smoke.mjs "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" "$RUNNER_TEMP/openma-deepseek-harness-acp-$(node -p "require('./package.json').version").tgz"
