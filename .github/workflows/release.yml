name: Release

# Publishing flow: bump version in package.json, tag the commit `vX.Y.Z`,
# push the tag. Tests gate the publish; npm auth is OIDC trusted publishing
# (no token, provenance attached automatically).

on:
  push:
    tags: ["v*"]

jobs:
  verify-tag:
    name: verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify release tag commit is on main
        run: bash scripts/verify-release-tag.sh "$GITHUB_SHA" origin/main

  test:
    needs: verify-tag
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # node:zlib zstd APIs (used by the harness session store) need >= 22.15
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  compatibility-versions:
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: echo "versions=$(cat runtime/compatibility.json)" >> "$GITHUB_OUTPUT"

  dsh-compatibility:
    needs: compatibility-versions
    name: dsh --profile (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.compatibility-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install independent dsh host
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host"
          npm exec -- pnpm --dir "$RUNNER_TEMP/dsh-host" add --ignore-scripts --config.auto-install-peers=true "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Pack ACP plugin
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Exercise the installed dsh profile
        run: npm exec -- node scripts/profile-smoke.mjs "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" "$RUNNER_TEMP/openma-deepseek-harness-acp-$(node -p "require('./package.json').version").tgz"

  package:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: "*.tgz"

  standalone:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
          path: artifact
      - name: Boot isolated bundled runtime
        shell: bash
        run: node scripts/standalone-smoke.mjs artifact/*.tgz

  publish:
    needs: [test, dsh-compatibility, standalone]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC trusted publishing
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # bundles npm >= 11.5.1 (OIDC-capable)
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
      - name: Publish the tested artifact to npm (OIDC)
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac
          echo "publishing with dist-tag: $DIST_TAG"
          TARBALL=$(find . -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          npm publish "$TARBALL" --tag "$DIST_TAG"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --verify-tag $PRERELEASE
