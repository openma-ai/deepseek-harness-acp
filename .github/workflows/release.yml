name: Release

# Publishing flow: bump version in package.json, tag the commit `vX.Y.Z`,
# push the tag. Tests gate the publish; npm auth is OIDC trusted publishing
# (no token, provenance attached automatically).

on:
  push:
    tags: ["v*"]

jobs:
  verify-tag:
    name: verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify release tag commit is on main
        run: bash scripts/verify-release-tag.sh "$GITHUB_SHA" origin/main

  test:
    needs: verify-tag
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # node:zlib zstd APIs (used by the harness session store) need >= 22.15
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  compatibility-versions:
    needs: verify-tag
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: echo "versions=$(cat runtime/compatibility.json)" >> "$GITHUB_OUTPUT"

  dsh-compatibility:
    needs: compatibility-versions
    name: dsh --profile (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.compatibility-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install independent dsh host
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host"
          npm exec -- pnpm --dir "$RUNNER_TEMP/dsh-host" add --ignore-scripts --config.auto-install-peers=true "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - name: Install pre-V3 migration host
        if: matrix.dsh == '0.1.5-rc.1'
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-legacy"
          npm exec -- pnpm --dir "$RUNNER_TEMP/dsh-legacy" add --ignore-scripts --config.auto-install-peers=true @deepseek-ai/dsh@0.1.2-rc.1
      - name: Verify session ownership and migration
        if: matrix.dsh == '0.1.5-rc.1'
        env:
          DSH_ACP_TEST_LEGACY_HOST: ${{ runner.temp }}/dsh-legacy/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_PATH: ${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_ACP_TEST_WRITE_HOST: ${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_ACP_TEST_HOST: ${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: npm test -- test/e2e.test.ts
      - name: Pack ACP plugin
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Exercise the installed dsh profile
        run: npm exec -- node scripts/profile-smoke.mjs "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" "$RUNNER_TEMP/openma-deepseek-harness-acp-$(node -p "require('./package.json').version").tgz"

  package:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prepack builds the pinned runtime and the slim shell tarball; the
      # runtime travels as its own npm package, paired by version and by the
      # sha256 recorded in vendor/runtime.json.
      - run: npm pack
      - name: Verify the shell and runtime artifacts are a matched pair
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/verify-release-artifacts.mjs \
            --shell "openma-deepseek-harness-acp-${VERSION}.tgz" \
            --runtime "vendor/openma-deepseek-harness-acp-runtime-${VERSION}.tgz"
      - name: Collect the runtime artifact
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          cp vendor/openma-deepseek-harness-acp-runtime-*.tgz "$RUNNER_TEMP/runtime/"
          node -e "const m=require('./vendor/runtime.json'); console.log('runtime sha256: '+m.sha256); console.log('runtime package: '+m.runtimePackage.name+'@'+m.runtimePackage.version)"
      - uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: "*.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-tgz
          path: "${{ runner.temp }}/runtime/*.tgz"

  standalone:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tgz
          path: runtime
      - name: Boot the pinned runtime from the local artifact
        shell: bash
        run: node scripts/standalone-smoke.mjs artifact/*.tgz --runtime-pack runtime/*.tgz

  # Same isolated install matrix as CI. Ubuntu also runs plugin add.
  # Windows stays on standalone-smoke only (several 175 MiB extracts).
  install-matrix:
    name: install matrix (${{ matrix.os }}, node ${{ matrix.node }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tgz
          path: runtime
      - name: Install a dsh host for plugin add
        if: startsWith(matrix.os, 'ubuntu')
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host"
          npm exec -- pnpm --dir "$RUNNER_TEMP/dsh-host" add --ignore-scripts --config.auto-install-peers=true "@deepseek-ai/dsh@$(node -p "require('./package.json').dshAcp.standaloneDsh")"
      - name: Make pnpm available for dsh plugin add
        if: startsWith(matrix.os, 'ubuntu')
        run: npm install -g pnpm
      - name: Run the isolated install matrix
        shell: bash
        run: |
          DSH_ARG=()
          if [ -x "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" ]; then
            DSH_ARG=(--dsh "$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js")
          fi
          node scripts/install-matrix.mjs --shell artifact/*.tgz --runtime-pack runtime/*.tgz "${DSH_ARG[@]}"

  # Refuse the tag before npm publish when the generated or published release
  # notes omit a pull request merged since the previous v* tag, or when the
  # version, lockfile, README pin, and tag disagree. Minor and major bumps
  # need release:minor / release:major. publish still creates the GitHub
  # Release with --generate-notes; this job does not tag or publish.
  release-check:
    name: release check
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # generate-notes preview; the Release is created later by publish
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
      - name: Fetch tags
        run: git fetch --tags --force origin
      - name: Check tag, versions, and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs --tag

  publish:
    needs: [test, dsh-compatibility, standalone, install-matrix, release-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC trusted publishing
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # bundles npm >= 11.5.1 (OIDC-capable)
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: package-tgz
          path: shell
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tgz
          path: runtime
      - name: Publish the tested artifacts to npm (OIDC)
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac
          echo "publishing with dist-tag: $DIST_TAG"
          SHELL_TARBALL=$(find shell -maxdepth 1 -name '*.tgz' -print -quit)
          RUNTIME_TARBALL=$(find runtime -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$SHELL_TARBALL"
          test -n "$RUNTIME_TARBALL"
          # Pair the artifacts again immediately before publish: version and
          # sha256 must still match. Publish the runtime package first so a
          # slim shell never lands on the registry without its runtime (first
          # standalone start would then 404).
          node scripts/verify-release-artifacts.mjs --shell "$SHELL_TARBALL" --runtime "$RUNTIME_TARBALL"
          npm publish "$RUNTIME_TARBALL" --tag "$DIST_TAG"
          npm publish "$SHELL_TARBALL" --tag "$DIST_TAG"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" shell/*.tgz runtime/*.tgz --generate-notes --verify-tag $PRERELEASE
