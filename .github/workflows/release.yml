name: Release

# Publishing flow: bump version in package.json, tag the commit `vX.Y.Z`,
# push the tag. Tests gate the publish; npm auth is OIDC trusted publishing
# (no token, provenance attached automatically).

on:
  push:
    tags: ["v*"]

jobs:
  verify-tag:
    name: verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify release tag commit is on main
        run: bash scripts/verify-release-tag.sh "$GITHUB_SHA" origin/main

  test:
    needs: verify-tag
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # node:zlib zstd APIs (used by the harness session store) need >= 22.15
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  dsh-compatibility:
    needs: verify-tag
    name: dsh compatibility (locked 0.1.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exercise session controls through the host
        run: npm run test:host
        env:
          DSH_ACP_TEST_HOST: ${{ github.workspace }}

  publish:
    needs: [test, dsh-compatibility]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC trusted publishing
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # bundles npm >= 11.5.1 (OIDC-capable)
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $PKG"
            exit 1
          fi
      - name: Publish to npm (OIDC)
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac
          echo "publishing with dist-tag: $DIST_TAG"
          npm publish --tag "$DIST_TAG"
      - name: Pack release asset
        run: npm pack
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --verify-tag $PRERELEASE
