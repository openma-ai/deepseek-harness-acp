# @deepseek-ai-harness/dsh-acp bundle patch: mounts the ACP stdio bridge over
# the profile's base bundle. Stdout carries ACP JSON-RPC exclusively, so the
# module-reload HMR row stays off (its watcher is unnecessary for a
# client-owned server process); dsh-base mounts no stdout logger.
#
# The bridge rides the profile's own composition — agents, adapters,
# credentials, persistence (the shared $DSH_HOME/sessions store), sandbox,
# tools, skills, subagents — and exposes it to ACP clients such as Zed:
#
#     dsh plugin --profile acp add -w @deepseek-ai-harness/dsh-acp
#     dsh --profile acp
#
# No provider/model is pinned here: sessions inherit the composition default
# (the model saved on the dsh Web UI Models page via agent-default-model,
# including its reasoning effort), and the model picker lists the live
# adapter directory. DSH_MODEL / DSH_PERMISSION_MODE override per launch;
# permanent overrides belong in the profile's cordis.patch.yml (id-targeted,
# last write wins).

- id: hmr
  disabled: true

- insert:
    - id: acp-bridge
      name: '@deepseek-ai-harness/dsh-acp/bridge'
      config:
        model: !!js process.env.DSH_MODEL
        permissionMode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
