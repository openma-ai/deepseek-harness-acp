# @openma/deepseek-harness-acp bundle patch: mounts the ACP stdio bridge over
# the profile's base bundle. Stdout carries ACP JSON-RPC exclusively, so the
# module-reload HMR row stays off (its watcher is unnecessary for a
# client-owned server process); dsh-base mounts no stdout logger.
#
# The bridge rides the profile's own composition — agents, adapters,
# credentials, persistence (the shared $DSH_HOME/sessions store), sandbox,
# tools, skills, subagents — and exposes it to ACP clients such as Zed:
#
#     dsh plugin --profile acp add -w @openma/deepseek-harness-acp
#     dsh --profile acp
#
# No provider/model is pinned here: sessions inherit the composition default
# (the model saved on the dsh Web UI Models page via agent-default-model,
# including its reasoning effort), and the model picker lists the live
# adapter directory. DSH_MODEL / DSH_PERMISSION_MODE override per launch;
# permanent overrides belong in the profile's cordis.patch.yml (id-targeted,
# last write wins).

- id: hmr
  disabled: true

# Model-facing tool rows move off the host plane and into each agent preset's
# own composition (standard/code/minimal/cordis ship complete agent.cordis.yml
# files) — the same split the web-app bundle makes, and what gives "minimal"
# its two-tool surface. Host-plane services (job/skill/goal registries,
# shell-env, sandbox, approval, the dynamic Cordis runner the cordis preset
# injects) stay on the host and serve every preset.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # Agent presets: per-session model-facing compositions (persona, tools,
    # compaction). The dsh CLI injects its shipped root into any row with this
    # id, so standard/code/minimal/creator are available and ACP session modes
    # surface them (~/.dsh/agent-presets adds user-authored ones).
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # Same host row the web-app bundle mounts. Without it, preset "cordis"
    # never activates: tool-cordis waits for dynamicCordisRunner, cordisInspect.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: acp-bridge
      name: '@openma/deepseek-harness-acp/bridge'
      config:
        model: !!js process.env.DSH_MODEL
        permissionMode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
